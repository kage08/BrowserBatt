[project]
name = "browserbatt"
version = "0.1.0"
description = "macOS browser battery efficiency benchmark using real installed browser profiles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
browserbatt = "browserbatt.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["browserbatt*"]
